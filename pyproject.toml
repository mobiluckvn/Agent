[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eaa"
version = "0.1.0"
description = "Embedded AIDD Agent — agent lập trình nhúng tổng quát (Engine / Platform Pack / Project)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Vũ Trí Công", email = "congvt@mobiluck.vn" }]

# Phụ thuộc engine giữ ở mức tối thiểu (NFR-04: chỉ Python 3.10+, toolchain, Git).
dependencies = [
    "pyyaml>=6.0",
    "networkx>=3.1",   # Knowledge Graph — ADR-08, không dùng graph database
    "pypdf>=4.0",      # trích văn bản từ trang PDF người chọn — AIS §4.1 bước 1
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    # Chỉ dùng cho scripts/lam_bang_tinh_nang.py — engine không import openpyxl.
    "openpyxl>=3.1",
]

[project.scripts]
eaa = "eaa.cli:main"

[tool.setuptools.packages.find]
include = ["eaa*"]

# Khuôn mẫu tài liệu thiết kế là DỮ LIỆU, không phải mã — nên setuptools không
# tự đưa vào gói. Thiếu dòng này thì bản `pip install` chạy được mọi lệnh trừ
# `eaa design`, và lỗi hiện ra là "chưa có khuôn mẫu nào" chứ không phải "cài
# thiếu tệp". Bắt được bằng TC-82.
[tool.setuptools.package-data]
eaa = ["docspec/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
    "tc: mã test case trong EAA-STP-04 / EAA-AIS-05 §11",
    # Bài gọi công cụ ngoài và tốn giây. Chạy MẶC ĐỊNH — chúng là thứ duy nhất
    # kiểm được nhánh PDF. Bỏ qua bằng `pytest -m "not cham"` khi cần vòng lặp
    # nhanh; đừng bỏ trước khi giao.
    "cham: chạy chậm vì gọi công cụ ngoài (LibreOffice)",
]

[tool.coverage.report]
# EAA-STP-04 §2: độ phủ ≥ 80% cho orchestrator/gates/state.
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
