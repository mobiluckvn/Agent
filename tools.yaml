# Tool Manifest — phần CHUNG thuộc engine (AIS §9.1).
#
# Manifest là DỮ LIỆU, không phải mã cứng. Nó tuân vòng đời tri thức của AIS §8
# như mọi kho khác: thêm một công cụ mới phải qua gate, và lịch sử thay đổi nằm
# trong Git.
#
# Phần theo Platform Pack nằm ở packs/<tên>/tools.yaml — cài pack nào thì
# doctor quét thêm phần của pack đó.

scope: engine

tools:

  - name: python
    # {python} là trình thông dịch ĐANG CHẠY engine — chính cái mà cổng
    # kiểm thử đơn vị và bộ chạy mô phỏng sẽ dùng. Kiểm "python3" trong
    # PATH là kiểm nhầm thứ khác.
    check: ["{python}", "--version"]
    min_version: "3.10"
    level: Must
    gates: [unittests, sim]
    install:
      macos: ["brew", "install", "python@3.12"]
      linux: ["sudo", "apt-get", "install", "-y", "python3"]
      windows: ["winget", "install", "-e", "--id", "Python.Python.3.12"]
    smoke: ["{python}", "-c", "print('eaa-smoke-ok')"]
    smoke_expect: "eaa-smoke-ok"
    note: Trình thông dịch chạy chính engine và cổng kiểm thử đơn vị.

  - name: git
    check: ["git", "--version"]
    min_version: "2.30"
    level: Must
    gates: [commit, merge]
    install:
      macos: ["brew", "install", "git"]
      linux: ["sudo", "apt-get", "install", "-y", "git"]
      windows: ["winget", "install", "-e", "--id", "Git.Git"]
    smoke: ["git", "--version"]
    smoke_expect: "git version"
    note: >-
      Nguồn sự thật duy nhất về phiên bản mã (AIS §8.4). Thiếu Git thì không có
      nhánh, không có commit truy vết, và bất biến merge mất chỗ đứng.

  # Bộ phân tích tĩnh KHÔNG nằm ở đây. Nó do Platform Pack gọi (pack AVR gọi
  # cppcheck kèm --platform=avr8), nên nó là nhu cầu của pack chứ không phải
  # của engine. Để ở manifest engine thì mọi dự án đều bị đòi nó, kể cả dự án
  # dùng nền khác với bộ phân tích khác — trái đúng điều kiến trúc ba tầng
  # dựng ra để tránh. Nó vào manifest của pack qua:
  #   eaa doctor --discover --propose  →  eaa gate approve G2
