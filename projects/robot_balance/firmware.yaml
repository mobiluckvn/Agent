# Bản thiết kế ráp firmware — công đoạn E, sản phẩm của người chứ không của máy.
#
# Vòng lặp chuẩn kiểm TỪNG module: dịch được, sạch phân tích tĩnh, qua unit
# test, vừa ngân sách bộ nhớ. Bốn câu ấy đúng cho từng mảnh, và không câu nào
# nói rằng các mảnh ghép lại thì chạy. Tệp này khai phần còn thiếu: module nào
# vào firmware, gọi hàm khởi tạo nào, chạy định kỳ mỗi bao nhiêu mili giây.
#
# Vì sao KHAI BÁO chứ không suy đoán: chu kỳ của một vòng điều khiển là một
# quyết định vật lý — nó đến từ động lực học của đối tượng, không đến từ mã
# nguồn. Máy đọc được tên hàm trong tệp tiêu đề, nhưng không đọc được rằng con
# lắc ngược cần 10 ms.
#
# Luật: MỌI module đã merge phải có mặt ở đây. Module chỉ để module khác gọi
# chứ không chạy định kỳ thì khai `step: null` — nói ra thì được, im lặng thì
# không. Bỏ quên một module đã qua G3 nghĩa là firmware nạp xuống mạch thiếu
# một phần mà mọi bằng chứng đều nói là có.

version: 1

# Độ phân giải bộ đếm thời gian của vòng lặp chính, đơn vị mili giây.
tick_ms: 1

# Tên ảnh sinh ra: build/firmware.elf, build/firmware.hex
image_name: firmware

# An toàn của ẢNH CHÍNH — thứ chỉ dự án trả lời được.
#
# Engine không đoán được một firmware có làm robot chạy hay không. Không khai
# thì cổng nạp đọc thẻ không thấy gì và duyệt ảnh này y như một ảnh đo tĩnh
# (SL-132).
#
# Checklist ở đây ĐẢO CHIỀU so với mọi kịch bản chẩn đoán. Chúng đòi "bánh
# KHÔNG chạm đất"; robot cân bằng thì bắt buộc bánh CHẠM đất, và nó không quay
# một nhịp rồi dừng — nó chạy vô hạn, và khi ngã thì không ai biết trước ngã về
# phía nào. Chép checklist cũ sang đây là dán một câu vô nghĩa vào đúng chỗ
# người ta cần đọc kỹ nhất.
safety:
  motion: true
  title: Firmware điều khiển cân bằng
  checklist:
    - Sàn quanh robot trống trong bán kính 1 m, không có vật cứng hay cạnh bàn
    - Có người đứng cạnh, tay sẵn sàng đỡ, và biết tắt nguồn động lực ở đâu
    - Nguồn động lực có công tắc ngắt trong tầm với, KHÔNG phải rút giắc
    - Robot đặt trên sàn phẳng, không phải mặt bàn cao
    - Dây nối máy tính đủ dài để robot ngã mà không giật đứt hoặc kéo đổ đồ

modules:
  # Chỉ app_balance chạy định kỳ. Mọi driver còn lại là thứ NÓ gọi, nên chúng
  # khai `step: null` — nói ra thì được, im lặng thì không.
  #
  # Và chỉ app_balance khai `init`: chính nó đã gọi imu_init/stepper_init/
  # buzzer_init/button_init trong app_init(). Khai thêm ở đây là khởi tạo hai
  # lần cùng một ngoại vi, và thứ tự giữa hai lần ấy không ai kiểm được.

  - id: app_balance
    init: app_init
    step: app_step
    # 4 ms, KHÔNG phải 10 ms của limits.control_loop_ms. Con số 4 đến từ mã
    # tham chiếu đã chạy trên chính bo này, và nó gắn cứng với hai hằng số
    # trong drv_imu: 0.000031 = 1/(131 x 250 Hz) và lọc bù 0.9996/0.0004. Đổi
    # chu kỳ ở đây mà quên hai hằng số kia là góc trôi sai hệ số, im lặng.
    # limits.control_loop_ms là TRẦN (chậm nhất được phép), không phải mục tiêu.
    period_ms: 4

  - id: drv_imu
    init: null
    step: null
    note: app_step() bơm imu_update() tới khi có mẫu; imu_init() do app_init() gọi

  - id: logic_pid
    init: null
    step: null
    note: hàm thuần, app gọi pid_compute mỗi nhịp

  - id: drv_i2c
    init: null
    step: null
    note: i2c_init() do imu_init() gọi; i2c_tick() do app_step() gọi mỗi nhịp

  - id: drv_stepper
    init: null
    step: null
    note: chạy bằng ngắt Timer2; app chỉ đặt tốc độ qua stepper_set_speed

  - id: drv_buzzer
    init: null
    step: null
    note: buzzer_update(now_ms) do app gọi — nó cần now_ms mà lịch không cấp

  - id: drv_button
    init: null
    step: null
    note: button_get_event(now_ms) do app gọi, cùng lý do như còi
