# Hardware Profile — EAA-SDD-03 §2, sản phẩm của công đoạn B2 (90% con người).
#
# Đây là DỮ LIỆU ĐẦU VÀO cho Datasheet Injection và là nguồn dựng tự động
# Knowledge Graph (FR-KG-01): node MCU/Peripheral/Register/Pin và cạnh
# has / configured_by / outputs_on được suy ra từ tệp này cộng với khai báo
# uses[] của từng module trong backlog.
#
# Sửa tệp này kích hoạt phân tích ảnh hưởng và phải duyệt lại tại G1
# (AIS §8.1) — đổi một chân là đổi mọi module chạm vào chân đó.

version: 1
project: robot_balance
description: Robot 2 bánh tự cân bằng — dự án mẫu kiểm chứng quy trình.

mcu:
  part: atmega328p
  clock_hz: 16000000
  flash_bytes: 32768
  sram_bytes: 2048
  eeprom_bytes: 1024

peripherals:
  - id: timer1
    kind: timer
    width_bits: 16
    configured_by: [TCCR1A, TCCR1B, OCR1A, TIMSK1]
    note: Ngắt chu kỳ cho vòng điều khiển và phát xung bước.
  - id: timer0
    kind: timer
    width_bits: 8
    configured_by: [TCCR0A, TCCR0B, OCR0A, TIMSK0]
    note: Dành cho tick của nhân điều phối — tách khỏi timer1 để tránh tranh chấp.
  # Khai ra 01/09/2026. Mã tham chiếu của bộ kit phát xung bước bằng TIMER2 ở
  # chu kỳ 20 µs (`TCCR2B |= (1<<CS21); OCR2A = 39;` → 16 MHz / 8 / 40 = 50 kHz),
  # và thuật toán phát xung đếm theo số lần ngắt ấy. Dùng lại đúng bộ đếm đã
  # chạy được trên chính cái bo này rẻ hơn dịch nó sang timer1: mỗi chỗ lệch
  # khỏi mã đã chứng minh là một vòng gỡ lỗi phải trả.
  - id: timer2
    kind: timer
    width_bits: 8
    configured_by: [TCCR2A, TCCR2B, OCR2A, TIMSK2]
    note: Ngắt 20 µs phát xung bước cho cả hai động cơ.
  - id: twi
    kind: i2c
    configured_by: [TWBR, TWCR, TWSR, TWDR]
    clock_hz: 400000        # fast-mode
    # Bus nhiều thiết bị: nhiều module được phép cùng dùng. Mặc định của engine
    # là ĐỘC CHIẾM, nên chia sẻ phải khai báo tường minh — thiếu khai báo thì bị
    # chặn (an toàn), chứ không phải lọt (nguy hiểm).
    shareable: true
  - id: usart0
    kind: uart
    # Thanh ghi DỮ LIỆU và cờ trạng thái thêm vào 31/08/2026 sau khi ds-043
    # (datasheet chính chủ, tr.200-203) qua G2.
    #
    # Vì sao chúng vắng mặt suốt bốn sprint: danh sách này liệt kê thanh ghi
    # CẤU HÌNH, và mọi phép kiểm sẵn sàng đều đi theo nó. Nên module cổng nối
    # tiếp được chấm "THIẾU 0 · đủ điều kiện sinh mã" trong khi nó không có
    # cách nào gửi một byte — thiếu UDR0 thì không có hàm truyền (SL-115).
    # Một thanh ghi không ai khai là một chỗ thiếu không ai thấy.
    configured_by: [UBRR0H, UBRR0L, UCSR0A, UCSR0B, UCSR0C,
                    UDR0, UDRE0, RXC0, TXC0]
    baud: 115200
    note: Kênh telemetry, cũng là kênh máy đọc được của chế độ chẩn đoán.

components:
  - id: imu
    part: mpu6050
    bus: twi
    address: 0x68
    provides: [accel_xyz, gyro_xyz, temperature]
    whoami_register: 0x75
    # TẬP mã nhận dạng chấp nhận được, không phải một giá trị.
    #
    # 0x68 — mã của MPU6050 đúng như thiết kế, theo tài liệu chính chủ (ds-031).
    # 0x72 — ĐO ĐƯỢC trên con chip đang cắm, ngày 01/09/2026.
    #
    # Vì sao nới: con chip trả 0x72 đã được kiểm là TƯƠNG THÍCH THANH GHI ở mọi
    # thanh ghi dự án dùng, đo trên chính bo này:
    #
    #   · trả lời ở địa chỉ bus 0x68                        (DS-01)
    #   · đọc được WHO_AM_I 0x75                            (DS-02)
    #   · ghi PWR_MGMT_1 0x6B đánh thức được — nếu không thì mọi số đọc về là 0
    #   · đọc chùm 14 byte từ ACCEL_XOUT_H 0x3B ra dữ liệu hợp lý
    #   · hệ số thang đo mặc định 16384 LSB/g và 131 LSB/(°/s) quy ra
    #     0,36 mg và 0,03 °/s — ĐÚNG DẢI VẬT LÝ. Dải đo mặc định khác thì hai
    #     con số ấy đã lệch hẳn một hệ số. Đây là bằng chứng mạnh nhất.
    #
    # Vì sao KHÔNG sửa thẳng thành 0x72: như thế là đánh mất 0x68, và cắm con
    # chip đúng thiết kế vào thì phép kiểm lại đỏ. Mỗi lần sửa một giá trị là
    # mỗi lần mất giá trị cũ; sau vài vòng nó chỉ còn nhớ thứ cắm gần nhất.
    #
    # Tập này MỞ RỘNG CÓ CHỦ Ý: thêm một mã là một quyết định tại G1, và con
    # chip thứ ba ngoài tập vẫn bị bắt.
    whoami_expected: [0x68, 0x72]
    # TRỤC ĐO — khai ra 01/09/2026, đọc từ mã tham chiếu của chính bộ kit.
    #
    # Trục nào đo được góc nghiêng phụ thuộc CÁCH GÁ con cảm biến lên thân
    # robot, không suy ra được từ tài liệu con chip. Mã tham chiếu chạy được
    # trên đúng cái bo này nói rõ:
    #
    #   Wire.write(0x3F);  → đọc 2 byte từ ACCEL_ZOUT_H  → góc nghiêng
    #   Wire.write(0x43);  → đọc 4 byte: 0x43 GYRO_X, 0x45 GYRO_Y → tốc độ
    #                        góc nghiêng lấy ở cặp thứ HAI (GYRO_Y)
    #
    # Thiếu khai báo này, module IMU đầu tiên sinh ra đọc ACCEL_X — một lựa
    # chọn hợp lý trên giấy và sai trên bàn. Không cổng phần mềm nào bắt được:
    # mã dịch sạch, test xanh, robot ngã.
    tilt_axis:
      accel: z          # ACCEL_ZOUT_H = 0x3F
      gyro: y           # GYRO_YOUT_H  = 0x45
    # Hệ số thang đo ứng với dải đo mã tham chiếu đặt.
    accel_range: "4g"        # ACCEL_CONFIG = 0x08 → 8192 LSB/g
    gyro_range: "250dps"     # GYRO_CONFIG  = 0x00 → 131 LSB/(°/s)

    # MỐC GIA TỐC — số thô của ACCEL_Z khi robot ở tư thế cân bằng.
    #
    # ĐO ĐƯỢC 03/09/2026 bằng DS-02 trên chính bo này, ở thang ±4 g:
    #   accel_x_mean = 8257   accel_y_mean = -123   accel_z_mean = -535
    # Độ lớn vector = 8275 = 1,010 g → X dọc trọng lực, Z NẰM NGANG. Đây là
    # số đo đóng lại câu hỏi trục, sau khi tôi suy từ triệu chứng và suy sai.
    #
    # Đây là HÌNH HỌC của robot (trọng tâm ở đâu so với trục bánh), KHÔNG phải
    # thuộc tính con chip. Nó không đổi giữa hai lần bật máy, nên đo một lần và
    # ghi ở đây — đúng cách V0 của nhà sản xuất làm (`acc_calibration_value`
    # = 376 ở V3, −2576 ở V1, đều là số của bo họ).
    #
    # KHÔNG đo lại lúc bật máy. Đo lại ở tư thế tay người đang giữ là tuyên bố
    # một tư thế nghiêng bất kỳ là "không độ", và khi ấy cổng khởi động ±0,5°
    # của mã tham chiếu mất hết ý nghĩa (SL-160).
    #
    # Không cần chính xác: `self_balance_setpoint` trong logic_pid dịch ±0,0015
    # mỗi vòng để tự tìm nốt điểm cân bằng thật. V0 cũng chỉ đọc MỘT lần.
    #
    # Dấu và thang: số này TRỪ khỏi số đọc thô, ở CÙNG thang ±4 g. Mã tham
    # chiếu CỘNG một số đã đảo dấu, và tệ hơn, V0 đo ở ±2 g (16384 LSB/g) trong
    # khi V3 dùng ở ±4 g — lệch đúng hai lần. Ta không chép lỗi ấy.
    accel_balance_offset: -535
    # Thanh ghi của CHÍNH linh kiện này, không phải của bus nó nằm trên.
    #
    # Thiếu khai báo này, đồ thị không có đường nào nối module tới trích đoạn
    # nói về con cảm biến — và bộ chuẩn truy xuất (TC-20) cho thấy hậu quả:
    # một trích đoạn về chế độ slave của bus, chỉ vì tình cờ chia sẻ một thanh
    # ghi, đẩy trích đoạn khởi động cảm biến ra khỏi ba chỗ của prompt.
    #
    # Danh sách này CỐ Ý chỉ có bốn thanh ghi của phần nhận dạng và khởi động —
    # đúng phần mà trích đoạn ds-031 đã qua G2. Thanh ghi cấu hình dải đo
    # (ACCEL_CONFIG, GYRO_CONFIG) thuộc ds-032, còn đang ở trạng thái proposed
    # vì chưa đối chiếu xong hệ số nhạy. Khai chúng ở đây bây giờ sẽ khiến
    # Readiness Check chặn vòng sinh mã — và chặn ĐÚNG: module không được viết
    # mã đặt dải đo khi tài liệu về dải đo chưa ai duyệt. Thêm chúng vào cùng
    # lúc duyệt ds-032, không sớm hơn.
    # ACCEL_CONFIG/GYRO_CONFIG thêm 01/09/2026, cùng lúc duyệt ds-032 — đúng
    # như dòng trên đã hẹn. Chỗ treo "chưa đối chiếu xong hệ số nhạy" được gỡ
    # bằng chính mã tham chiếu của bộ kit, hai con số độc lập:
    #
    #   · `GYRO_CONFIG = 0x00` (±250 °/s) và hằng số tích phân góc 0.000031
    #     = 1/(131 × 250 Hz) — khớp 131 LSB/(°/s) của dải ±250.
    #   · `ACCEL_CONFIG = 0x08` (±4 g) và `asin(raw / 8200)` — khớp 8192 LSB/g
    #     của dải ±4 g.
    #
    # Hai con số ấy nằm ở hai chỗ khác nhau trong mã và cùng chỉ về một cấu
    # hình. Đó là đối chiếu, không phải suy đoán.
    configured_by: [WHO_AM_I, PWR_MGMT_1, SMPLRT_DIV, CONFIG,
                    ACCEL_CONFIG, GYRO_CONFIG, ACCEL_XOUT_H, GYRO_XOUT_H]
  # CHÂN SỬA NGÀY 01/09/2026 — hồ sơ cũ mô tả một THIẾT KẾ, không phải cái bo
  # trên bàn. Nó nằm im bốn sprint vì chưa lần nào có xung thật đi ra chân thật.
  #
  # Bằng chứng, hai nguồn độc lập trong `sources/` của chính bộ kit này:
  #
  #   · sơ đồ nguyên lý (BLKLab_Balancing_Robot_Nguyen_Ly.pdf) — các nét mang
  #     tên STEP1, DIR1, STEP2, DIR2, và KHÔNG có nét ENABLE nào về vi điều
  #     khiển
  #   · mã tham chiếu V3 — `#define STEP1 5 / DIR1 4 / STEP2 7 / DIR2 6`, và
  #     `pinMode` chỉ đặt bốn chân ấy, không có chân enable nào
  #
  # Hồ sơ cũ khai PB1/PB2/PB3/PB4 (D9-D12) — KHÁC CẢ CỔNG. Trên bo này D11 là
  # chân dữ liệu dải LED WS2812, nên bản đo DS-03 đầu tiên đã phát xung vào
  # dải LED trong khi hai chân STEP thật nằm im. Máy báo đủ 200 xung ở 1 kHz;
  # người nhìn thấy không bánh nào nhúc nhích (SL-125).
  #
  # `enable` BỎ HẲN, không phải để trống: A4988 bật cứng trên bo. Khai một chân
  # enable không tồn tại là mời mã đi ghi vào một chân của khối khác.
  #
  # CÒN LÀ GIẢ ĐỊNH: động cơ 1 ↔ trái và động cơ 2 ↔ phải. Sơ đồ và mã tham
  # chiếu đều chỉ đánh số 1/2, không nói bên nào. DS-03 phát xung TỪNG ĐỘNG CƠ
  # một và hỏi người bánh nào quay — nên phép đo kế tiếp sẽ chốt được điều này.
  # `steps_per_rev` khai ra ngày 01/09/2026. Trước đó nó là con số 200 nằm
  # trong đầu người viết: mọi phép quy đổi xung → góc đều dùng nó, và không
  # chỗ nào khai. Một hằng số không khai thì không đối chiếu được, và câu hỏi
  # cho người đã lệch khỏi firmware vì đúng lý do ấy (SL-126).
  # TRÁI/PHẢI chốt bằng MẮT ngày 01/09/2026, không suy ra.
  #
  # Bản trước gán động cơ 1 (STEP1/DIR1 = D5/D4) cho bên TRÁI — một giả định,
  # vì sơ đồ nguyên lý và mã tham chiếu đều chỉ đánh số 1/2 và không nói bên
  # nào. DS-03 phát xung TỪNG ĐỘNG CƠ một; người quan sát thấy bánh PHẢI quay
  # trước, tức động cơ 1 là bên phải. Mã tham chiếu xác nhận: khối tính xung
  # `right_motor` thao tác trên D5/D4, khối `left_motor` trên D7/D6.
  #
  # `dir_forward_level` — mức logic của chân DIR để ROBOT đi TỚI.
  #
  # Hai động cơ lắp ĐỐI XỨNG GƯƠNG, nên hai bên phải KHÁC mức. Quan hệ ấy chốt
  # từ DS-03 và từ mã tham chiếu (cùng một dấu giá trị điều khiển thì DIR1 và
  # DIR2 ở hai mức ngược nhau).
  #
  # CHIỀU TUYỆT ĐỐI thì DS-03 KHÔNG chốt được, và tôi đã kết luận vội một lần.
  # ------------------------------------------------------------------------
  # DS-03 quay từng bánh MỘT. Người quan sát nói "bánh trái tiến, bánh phải
  # lùi", và tôi đọc câu ấy thành `dir_forward_level` trái = 0. Sai: nhìn MỘT
  # bánh quay thì không suy ra được robot sẽ đi về đâu — chiều ấy chỉ có nghĩa
  # khi cả hai bánh cùng chạy, và nó phụ thuộc cả vào việc bánh nằm bên nào
  # của thân xe.
  #
  # DS-07 cho cả hai chạy cùng lúc. Với trái=0/phải=1, người quan sát thấy
  # robot đi LÙI. Nên hai giá trị dưới đây là bản ĐÃ ĐẢO, và chúng đến từ phép
  # đo đúng loại câu hỏi (SL-128).
  #
  # Quy tắc rút ra: đại lượng nào chỉ có nghĩa ở mức HỆ THỐNG thì đừng chốt nó
  # bằng một phép đo ở mức LINH KIỆN, dù phép đo ấy sạch và người quan sát
  # trung thực.
  #
  # Khai ra ở đây vì đây là chỗ duy nhất mọi module đọc chung. Không khai thì
  # module đầu tiên điều khiển hai bánh sẽ đặt cùng mức cho cả hai, và robot
  # quay tại chỗ thay vì đi tới — một lỗi không cổng phần mềm nào bắt được.
  - id: motor_driver_left
    part: a4988
    microstep: 16
    steps_per_rev: 200
    pins: {step: PD7, dir: PD6}
    dir_forward_level: 1
  - id: motor_driver_right
    part: a4988
    microstep: 16
    steps_per_rev: 200
    pins: {step: PD5, dir: PD4}
    dir_forward_level: 0

  # HAI LINH KIỆN DƯỚI ĐÂY KHAI RA NGÀY 01/09/2026, đọc từ mã tham chiếu của
  # chính bộ kit (`sources/.../V3_Balancing_Robot_PID_App.ino`):
  #
  #     #define COI 10                     → D10 = PB2
  #     #define BUTTON_SET_PIN 12          → D12 = PB4
  #     pinMode(COI, OUTPUT); digitalWrite(COI, LOW);
  #     pinMode(BUTTON_SET_PIN, INPUT_PULLUP);
  #
  # Chúng có mặt trên bo từ đầu và hồ sơ chưa bao giờ khai — nên mọi bản phân
  # rã cho tới nay không có cách nào biết robot này CÓ còi và CÓ nút. Giao thức
  # khởi động bằng tiếng bíp không thể phân rã ra từ một hồ sơ không nhắc tới
  # còi.
  - id: buzzer
    part: buzzer_5v
    pins: {signal: PB2}
    active_level: 1        # digitalWrite(COI, HIGH) là kêu
    # CÒI CHỦ ĐỘNG: nó tự dao động, chỉ cần đặt MỨC chân, KHÔNG cần PWM và
    # KHÔNG cần bộ đếm nào. Mã tham chiếu làm đúng thế — `digitalWrite(COI,
    # HIGH)` rồi `digitalWrite(COI, LOW)` sau một số vòng đếm, không có
    # `tone()` và không cấu hình timer nào cho nó.
    #
    # Khai rõ ở đây vì thiếu dòng này, bản phân rã đầu tiên đã xin `timer2`
    # cho còi — đúng bộ đếm đang phát xung bước. Một cái còi cướp mất nhịp
    # bước là robot ngã, và không cổng phần mềm nào bắt được.
    drive: dc_on_off
    # Thanh ghi cổng B — khai ra 01/09/2026. Thiếu dòng này, bảng kiểm sẵn sàng
    # chấm "THIẾU 0" và mở vòng sinh mã, rồi Agent viết đúng kỷ luật:
    #     // Thiếu thông tin tài liệu thanh ghi cho PB4. Không lấp chỗ trống.
    # Module qua sạch bốn cổng mà không đọc nổi một chân (SL-143).
    configured_by: [DDRB, PORTB]
    note: Còi chip 5V tự dao động, kênh báo hiệu DUY NHẤT người dùng nghe được.
  - id: button_set
    part: tactile_switch
    pins: {signal: PB4}
    active_level: 0        # nút nối về GND, dùng pull-up nội
    pullup: internal
    debounce_ms: 20        # theo mybutton.h của bộ kit
    # PINB để ĐỌC mức thật của chân; PORTB để bật điện trở kéo lên nội.
    configured_by: [DDRB, PORTB, PINB]
    note: Nút SET, dùng làm lệnh "bắt đầu hiệu chỉnh" của giao thức khởi động.

# Cách nạp firmware xuống bo, và cách nhận ra bo khi nó được cắm vào USB.
#
# Ở tầng DỰ ÁN chứ không phải pack: cầu USB-nối tiếp là thuộc tính của cái bo cụ
# thể đang nằm trên bàn, không phải của họ vi điều khiển. Cùng một ATmega328P có
# thể nằm trên bo dùng cầu này hay cầu khác.
#
# Engine coi mọi giá trị dưới đây là chuỗi mờ: nó chuyển `tool` và `baud` xuống
# chỗ giữ {programmer}/{baud} của pack, và so `usb` với những gì hệ điều hành
# báo — không diễn giải giá trị nào.
programmer:
  tool: arduino          # giao thức nạp qua bootloader có sẵn trên bo
  # ĐO ĐƯỢC trên bo thật 31/08/2026, không phải suy ra.
  #
  # Giá trị cũ ở đây là 115200 — chép từ tốc độ telemetry của usart0, và hai
  # thứ ấy KHÔNG liên quan gì nhau: một cái là tốc độ bootloader thỏa thuận
  # lúc nạp, cái kia là tốc độ chương trình chạy sau đó. Trùng số làm chúng
  # trông như một, và không ai kiểm lại.
  #
  # Hậu quả đo được: avrdude báo `not in sync: resp=0x00` mười lần liền. Thử
  # lần lượt 115200 / 57600 / 19200 / 250000 thì chỉ 57600 đồng bộ được, và
  # đọc ra chữ ký chip 1E 95 0F — đúng ATmega328P mà hồ sơ khai.
  #
  # Đây là một giả định đã nằm im bốn sprint, chỉ lộ ra ở lần đầu nạp thật.
  baud: 57600
  usb:
    - vid: "2341"
      pid: "0043"
      note: Bo chính hãng, cầu USB dùng vi điều khiển phụ
    - vid: "1a86"
      pid: "7523"
      note: Bo tương thích, cầu USB rời
  # Dùng khi máy không đọc được VID/PID: khớp theo tên cổng, kém chắc chắn hơn
  # hẳn nên kết quả được ghi rõ là "chưa xác nhận".
  #
  # Sửa 2026-08-29 sau khi cắm bo thật: bo trên bàn dùng cầu CH340, hệ điều
  # hành đặt tên cổng là /dev/cu.usbserial-*. Giá trị cũ 'usbmodem' bắt trúng
  # cổng ST-LINK của một bo STM32 cắm cùng lúc — một gợi ý tên sai không báo
  # lỗi, nó chỉ trỏ sang nhầm thiết bị.
  port_hint: usbserial

# BẢNG CHÂN SỬA NGÀY 01/09/2026 — bản cũ mô tả một THIẾT KẾ chưa từng tồn tại.
#
# Nó khai bốn chân động cơ trên PB0–PB4, trong khi `components` ở trên đã được
# sửa từ trước sang PD4–PD7 theo sơ đồ nguyên lý và mã tham chiếu. Hai chỗ
# trong CÙNG MỘT TỆP nói hai điều khác nhau suốt bốn sprint, và không phép
# kiểm nào đối chiếu chúng — vì chưa module nào đọc cả hai.
#
# Nó thành nguy hiểm THẬT ngay hôm nay: còi nằm ở PB2 và nút nhấn ở PB4, đúng
# hai chân bảng cũ đang khai là DIR_L và DIR_R. Giữ bảng cũ thì đồ thị tri thức
# sẽ báo xung đột tài nguyên cho hai linh kiện hoàn toàn không xung đột — hoặc
# tệ hơn, mã sinh ra đi ghi mức DIR vào chân còi.
pin_map:
  PB2: {net: BUZZER, direction: out, note: Còi chip 5V, mức CAO là kêu}
  PB4: {net: BUTTON_SET, direction: in, note: Nút nhấn về GND, cần pull-up nội}
  PC4: {net: SDA, direction: bidir, peripheral: twi}
  PC5: {net: SCL, direction: out, peripheral: twi}
  PD0: {net: UART_RX, direction: in, peripheral: usart0}
  PD1: {net: UART_TX, direction: out, peripheral: usart0}
  PD4: {net: DIR_R, direction: out}
  PD5: {net: STEP_R, direction: out}
  PD6: {net: DIR_L, direction: out}
  PD7: {net: STEP_L, direction: out}

# Bảng chức năng thay thế — trích từ bảng *alternate functions* của datasheet.
#
# Đây là dữ liệu để engine ĐỐI CHIẾU: một chân được gán chức năng mà nó không
# hỗ trợ là loại lỗi chỉ lộ ra sau khi đã hàn, và sửa trên giấy rẻ hơn sửa
# trên bo (N-014). Không có bảng này thì phép kiểm ấy trả về "chưa kiểm được"
# — trung thực, nhưng vô dụng.
#
# Engine KHÔNG biết chân nào làm được gì và không được biết: tri thức này
# thuộc về đúng một họ vi điều khiển, nên nó nằm ở tầng dự án (FR-PLT-01).
pin_functions:
  PB0: [gpio, icp1, clko]
  PB1: [gpio, oc1a]
  PB2: [gpio, oc1b, ss]
  PB3: [gpio, mosi, oc2a]
  PB4: [gpio, miso]
  PB5: [gpio, sck]
  PC4: [gpio, sda, adc4]
  PC5: [gpio, scl, adc5]
  PD0: [gpio, rxd]
  PD1: [gpio, txd]
  PD2: [gpio, int0]
  PD3: [gpio, int1, oc2b]
  # PD4 và PD7 thiếu ở bảng này suốt bốn sprint, đúng vì bảng chân cũ tưởng
  # động cơ nằm trên cổng B. Thiếu một hàng ở đây thì phép đối chiếu chức năng
  # thay thế trả về "chưa kiểm được" cho đúng hai chân mang xung bước.
  PD4: [gpio, xck, t0]
  PD5: [gpio, oc0b, t1]
  PD6: [gpio, oc0a, ain0]
  PD7: [gpio, ain1]

power:
  # Rủi ro brown-out đã lường trước ở thiết kế B2; kịch bản chẩn đoán DS-05
  # kiểm đúng điều này dưới tải.
  logic_rail: {voltage: 5.0, source: LDO từ nguồn động lực}
  motor_rail: {voltage: 12.0, source: pin 3S}
  separated: true
  note: >-
    Tách nguồn động lực và nguồn điều khiển; sụt áp khi động cơ tăng tốc là
    nguyên nhân reset ngẫu nhiên đã lường trước.

mechanics:
  # Giả định vật lý — vào Assumption Log ở trạng thái proposed cho tới khi có
  # số đo thật thay thế (AIS §8.1: tri thức thực chứng luôn thắng giả định).
  wheel_radius_m: 0.0425
  body_mass_kg: 0.85
  com_height_m: 0.11
  friction_coeff: 0.02   # ước lượng, chưa đo
