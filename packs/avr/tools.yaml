# Tool Manifest — bồi dần qua gate, KHÔNG chép sẵn.
#
# Mỗi mục ở đây là một công cụ đã được người duyệt: biết tên, biết cách
# kiểm phiên bản, biết cách cài. Nhu cầu công cụ thì suy ra từ pack.yaml
# chứ không khai báo ở đây (AIS §9.1, §9.2).
#
# 'requires' dùng cho HAI việc: sắp thứ tự cài, và phát hiện hai thẻ cùng
# đòi một thứ ở hai phiên bản đá nhau (SL-90). 'method' nói cách cài.

scope: pack:avr
tools:
- name: avr-gcc
  check:
  - avr-gcc
  - -dumpversion
  # HẠ TỪ 12.0 (SL-113): không bản dựng sẵn nào của AVR GCC cho macOS
  # x86_64 đạt 12.0, và dựng từ nguồn thì hỏng. Con số 12.0 do vòng tra
  # cứu công cụ đề xuất, không do một yêu cầu nào của dự án — nó chặn
  # đúng cổng mà nó sinh ra để bảo vệ.
  min_version: '7.3'
  level: Must
  gates:
  - compile
  # macOS: KHÔNG có đường Homebrew nào chạy được trên máy Intel.
  # Kho ngoài osx-cross/avr chỉ có bản dựng sẵn cho arm64; trên x86_64 nó dựng
  # từ mã nguồn, và bản dựng ấy hỏng với SDK macOS đời mới
  # (`fatal error: 'new' file not found` — GCC 9 không hợp trình dịch hệ thống).
  #
  # Nên dùng đúng đường thiết kế đã chừa cho tình huống này: TẢI TRỰC TIẾP kèm
  # checksum bắt buộc (TC-35). Gói là bản dựng sẵn chính chủ của Arduino, cùng
  # bộ mà toàn hệ sinh thái AVR đang chạy.
  download: https://downloads.arduino.cc/tools/avr-gcc-7.3.0-atmel3.6.1-arduino7-x86_64-apple-darwin14.tar.bz2
  checksum: "sha256:f6ed2346953fcf88df223469088633eb86de997fa27ece117fd1ef170d69c1f8"
  pre_install:
    macos:
    - - /bin/mkdir
      - -p
      - /usr/local/opt/eaa-avr
    - - /usr/bin/tar
      - -xjf
      - '{tai_ve}'
      - -C
      - /usr/local/opt/eaa-avr
      - --strip-components
      - '1'
    - - /bin/ln
      - -sf
      - /usr/local/opt/eaa-avr/bin/avr-gcc
      - /usr/local/bin/avr-gcc
  install:
    linux:
    - sudo
    - apt-get
    - install
    - -y
    - gcc-avr
    macos:
    - /usr/bin/true
    windows:
    - choco
    - install
    - avr-gcc
    - -y
  version_regex: (\d+\.\d+(?:\.\d+)?)
  scope: pack:avr
  note: Trình biên dịch GNU C/C++ dành cho vi điều khiển họ Atmel AVR. — Được gọi
    bởi Platform Pack 'avr' để biên dịch mã nguồn C/C++ thành mã thực thi cho vi điều
    khiển AVR.
  smoke:
  - avr-gcc
  - --version
  smoke_expect: avr-gcc
  approved_by: vu-tri-cong
  approved_at: '2026-08-29T08:59:56+00:00'
  method: gói
- name: avr-size
  check:
  - avr-size
  - --version
  min_version: '2.26'
  level: Must
  gates:
  - size
  # macOS: KHÔNG có đường Homebrew nào chạy được trên máy Intel.
  # Kho ngoài osx-cross/avr chỉ có bản dựng sẵn cho arm64; trên x86_64 nó dựng
  # từ mã nguồn, và bản dựng ấy hỏng với SDK macOS đời mới
  # (`fatal error: 'new' file not found` — GCC 9 không hợp trình dịch hệ thống).
  #
  # Nên dùng đúng đường thiết kế đã chừa cho tình huống này: TẢI TRỰC TIẾP kèm
  # checksum bắt buộc (TC-35). Gói là bản dựng sẵn chính chủ của Arduino, cùng
  # bộ mà toàn hệ sinh thái AVR đang chạy.
  download: https://downloads.arduino.cc/tools/avr-gcc-7.3.0-atmel3.6.1-arduino7-x86_64-apple-darwin14.tar.bz2
  checksum: "sha256:f6ed2346953fcf88df223469088633eb86de997fa27ece117fd1ef170d69c1f8"
  pre_install:
    macos:
    - - /bin/mkdir
      - -p
      - /usr/local/opt/eaa-avr
    - - /usr/bin/tar
      - -xjf
      - '{tai_ve}'
      - -C
      - /usr/local/opt/eaa-avr
      - --strip-components
      - '1'
    - - /bin/ln
      - -sf
      - /usr/local/opt/eaa-avr/bin/avr-size
      - /usr/local/bin/avr-size
  install:
    linux:
    - sudo
    - apt-get
    - install
    - -y
    - binutils-avr
    macos:
    - /usr/bin/true
    windows:
    - choco
    - install
    - avr-gcc
    - -y
  version_regex: (\d+\.\d+(?:\.\d+)?)
  scope: pack:avr
  note: Công cụ hiển thị kích thước các section (Flash, RAM, EEPROM) của file thực
    thi hoặc object file cho vi điều khiển AVR. — Cần thiết để tính toán và kiểm tra
    dung lượng bộ nhớ mà firmware sẽ chiếm dụng trên vi điều khiển AVR trước khi nạp.
  smoke:
  - avr-size
  - --help
  smoke_expect: 'Usage: avr-size'
  approved_by: vu-tri-cong
  approved_at: '2026-08-29T08:59:56+00:00'
  requires:
    avr-gcc: ''
  method: gói
- name: avrdude
  check:
  - avrdude
  - -?
  min_version: '7.0'
  level: Must
  gates:
  - flash
  install:
    linux:
    - sudo
    - apt-get
    - install
    - -y
    - avrdude
    macos:
    - brew
    - install
    - avrdude
    windows:
    - choco
    - install
    - avrdude
    - -y
  version_regex: (\d+\.\d+(?:\.\d+)?)
  scope: pack:avr
  note: Công cụ dòng lệnh để đọc, ghi và thao tác với bộ nhớ của vi điều khiển Atmel
    AVR. — Được Platform Pack 'avr' gọi để thực hiện quá trình nạp (flash) firmware
    xuống vi điều khiển.
  smoke:
  - avrdude
  - -?
  smoke_expect: avrdude version
  approved_by: vu-tri-cong
  approved_at: '2026-08-29T08:59:56+00:00'
  requires:
    libusb: '>=1.0'
  alternatives:
  - dfu-programmer
  method: gói
- name: cppcheck
  check:
  - cppcheck
  - --version
  min_version: '2.10'
  level: Must
  gates:
  - static
  install:
    linux:
    - sudo
    - apt-get
    - install
    - -y
    - cppcheck
    macos:
    - brew
    - install
    - cppcheck
    windows:
    - winget
    - install
    - -e
    - --id
    - cppcheck.cppcheck
  version_regex: (\d+\.\d+(?:\.\d+)?)
  scope: pack:avr
  note: Công cụ phân tích tĩnh (static analysis) mã nguồn C/C++ giúp phát hiện lỗi
    và các hành vi không xác định. — Cung cấp năng lực phân tích tĩnh (static analysis)
    để đảm bảo chất lượng và độ tin cậy của mã nguồn C/C++ cho vi điều khiển AVR.
  smoke:
  - cppcheck
  - --version
  smoke_expect: Cppcheck
  error_regex: ^\[(?P<file>[^:]+):(?P<line>\d+)\]:\s+(?P<msg>.*)$
  approved_by: vu-tri-cong
  approved_at: '2026-08-29T09:01:50+00:00'
  method: gói
- name: avr-objcopy
  check:
  - avr-objcopy
  - --version
  min_version: '2.26'
  level: Must
  gates:
  - hex
  # macOS: KHÔNG có đường Homebrew nào chạy được trên máy Intel.
  # Kho ngoài osx-cross/avr chỉ có bản dựng sẵn cho arm64; trên x86_64 nó dựng
  # từ mã nguồn, và bản dựng ấy hỏng với SDK macOS đời mới
  # (`fatal error: 'new' file not found` — GCC 9 không hợp trình dịch hệ thống).
  #
  # Nên dùng đúng đường thiết kế đã chừa cho tình huống này: TẢI TRỰC TIẾP kèm
  # checksum bắt buộc (TC-35). Gói là bản dựng sẵn chính chủ của Arduino, cùng
  # bộ mà toàn hệ sinh thái AVR đang chạy.
  download: https://downloads.arduino.cc/tools/avr-gcc-7.3.0-atmel3.6.1-arduino7-x86_64-apple-darwin14.tar.bz2
  checksum: "sha256:f6ed2346953fcf88df223469088633eb86de997fa27ece117fd1ef170d69c1f8"
  pre_install:
    macos:
    - - /bin/mkdir
      - -p
      - /usr/local/opt/eaa-avr
    - - /usr/bin/tar
      - -xjf
      - '{tai_ve}'
      - -C
      - /usr/local/opt/eaa-avr
      - --strip-components
      - '1'
    - - /bin/ln
      - -sf
      - /usr/local/opt/eaa-avr/bin/avr-objcopy
      - /usr/local/bin/avr-objcopy
  install:
    linux:
    - sudo
    - apt-get
    - install
    - -y
    - binutils-avr
    macos:
    - /usr/bin/true
    windows:
    - choco
    - install
    - avr-gcc
    - -y
  version_regex: (\d+\.\d+(?:\.\d+)?)
  scope: pack:avr
  note: Công cụ GNU objcopy cho kiến trúc AVR, dùng để sao chép và chuyển đổi các
    tệp đối tượng (ví dụ từ ELF sang HEX). — Cần thiết để trích xuất mã máy từ tệp
    ELF và tạo tệp định dạng Intel HEX để nạp vào bộ nhớ flash của vi điều khiển AVR.
  smoke:
  - avr-objcopy
  - --help
  smoke_expect: 'Usage: avr-objcopy'
  approved_by: vu-tri-cong
  approved_at: '2026-08-29T09:57:55+00:00'
  requires:
    avr-gcc: ''
  method: gói
