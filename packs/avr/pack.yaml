# Platform Pack: AVR 8-bit — pack đầu tiên của MVP (EAA-SRS-01 §1.2, FR-PLT-02).
#
# Đây là ranh giới: mọi tên công cụ, cờ biên dịch và quy ước riêng của họ AVR
# nằm TRONG tệp này và các thư mục cạnh nó. Engine (eaa/) không biết chữ "avr"
# nào — nó chỉ đọc các năng lực khai báo dưới đây qua eaa/platform.py.
#
# Thêm họ MCU mới = thêm packs/<tên>/pack.yaml tương tự, không sửa engine (NFR-05).

pack: avr
version: 0.1.0
description: >-
  Toolchain, quy tắc phân tích tĩnh và quy ước cho vi điều khiển AVR 8-bit.

targets:
  - atmega328p

rules_dir: rules
prompts_dir: prompts
smoke_dir: smoke

# Khuôn ráp firmware. Engine biết module nào chạy mỗi bao nhiêu mili giây; nó
# KHÔNG biết viết vòng lặp chính cho một họ vi điều khiển. Phần chữ nằm ở đây,
# engine chỉ thay chỗ giữ — nếu engine phải tự sinh câu lệnh C thì ranh giới mà
# TC-38 canh sẽ mờ dần từ đúng chỗ đó.
firmware:
  template: templates/main.c.tmpl
  output: main.c
  include_line: '#include "{module}.h"'
  init_line: '    {init}();'
  task_line: '    { {step}, {period_ms} },'

# Bộ khung firmware chẩn đoán. Phần ĐO của từng kịch bản nằm ở tầng dự án
# (diagnostics.yaml → firmware_template); khuôn này chỉ lo phần chung: bật
# UART, đóng gói khung telemetry, gọi diag_run(). Hai tệp được LIÊN KẾT với
# nhau chứ không dán chuỗi, nên bộ dịch kiểm được cả hai.
diagnostics:
  template: templates/diagnostic.c.tmpl
  output: diag_{scenario}.c
  image_name: diag_{scenario}

# Phiên bản tối thiểu; eaa doctor đối chiếu và ghi vào env_lock.json (FR-ENV-01/04).
# CẢNH BÁO: những số này lặp lại `min_version` trong `tools.yaml` của pack —
# hai chỗ khai cùng một điều, và chúng ĐÃ từng lệch nhau (SL-114). Chỗ nào
# đúng thì chưa có gì trả lời được, vì không phép kiểm nào đối chiếu hai bên.
tool_requirements:
  avr-gcc: ">=7.3"
  avr-size: ">=2.26"
  avr-objcopy: ">=2.26"
  avrdude: ">=7.0"
  cppcheck: ">=2.10"

# Khuôn sinh tệp tiêu đề module (N-041). Giao diện được sinh TRƯỚC phần thân,
# nên hai module phụ thuộc nhau viết song song được — mỗi bên chỉ trông vào
# hợp đồng gọi bên kia đã hứa. Engine cấp dữ liệu (tên hàm, hợp đồng), pack
# cấp cú pháp: macro chống nạp trùng và cách viết chú thích là chuyện nền tảng.
interfaces:
  template: templates/module.h.tmpl
  output: "{module}.h"
  function_line: "{signature};"
  comment_line: "/* {comment} */"
  include_line: '#include "{header}"'

# Trình gỡ lỗi sâu của họ MCU này (N-085, mức tự chủ T0). Engine KHÔNG biết
# những tên này — nó chỉ nhận danh sách và kiểm xem máy có chúng chưa.
debug_tools:
  - avr-gdb
  - avarice

capabilities:

  compile:
    description: >-
      Dịch MỘT tệp nguồn thành tệp đối tượng. Không liên kết: một module driver
      không có main() và không cần có — liên kết là năng lực 'link' bên dưới,
      chạy ở công đoạn ráp firmware chứ không ở vòng kiểm từng module.
    command:
      - avr-gcc
      - -c
      - -mmcu={mcu}
      - -DF_CPU={clock_hz}UL
      - -Os
      - -std=gnu11
      - -Wall
      - -Wextra
      - -Werror
      - -ffunction-sections
      - -fdata-sections
      - -I{include_dir}
      - -o
      - "{output}"
      - "{source}"
    timeout_s: 120
    parse:
      success_exit_codes: [0]
      error_regex: "^(?P<file>[^:]+):(?P<line>\\d+):\\d+:\\s+error:\\s+(?P<msg>.+)$"
      warning_regex: "^(?P<file>[^:]+):(?P<line>\\d+):\\d+:\\s+warning:\\s+(?P<msg>.+)$"

  link:
    description: >-
      Gộp các tệp đối tượng thành ảnh ELF chạy được. Đây là nơi main() trở nên
      bắt buộc, và là nơi --gc-sections thật sự cắt được mã chết — cờ ấy vô
      nghĩa ở bước dịch từng tệp.
    command:
      - avr-gcc
      - -mmcu={mcu}
      - -Os
      - -Wl,--gc-sections
      - -Wl,-Map={map}
      - -o
      - "{output}"
      - "{objects}"
    timeout_s: 120
    parse:
      success_exit_codes: [0]
      error_regex: "^(?:.*:\\s+)?(?P<msg>undefined reference to .+|.*\\bld:.*)$"

  hex:
    description: Đổi ảnh ELF sang Intel HEX — định dạng công cụ nạp đọc được.
    command:
      - avr-objcopy
      - -O
      - ihex
      - -R
      - .eeprom
      - "{input}"
      - "{output}"
    timeout_s: 60
    parse:
      success_exit_codes: [0]
      error_regex: "^avr-objcopy:\\s+(?P<msg>.+)$"

  size:
    description: >-
      Đo chiếm dụng Flash và SRAM. Các khóa metric ở đây là hợp đồng với
      constraints.yaml của dự án (flash_pct_max, sram_pct_max) — engine chỉ so
      sánh số, không biết Flash hay SRAM nghĩa là gì.
    command:
      - avr-size
      # `--mcu=` chứ KHÔNG phải `-mmcu=`. Dạng `-mmcu` là cờ của trình biên
      # dịch; `avr-size` là công cụ binutils và chỉ nhận dạng dài. Bản dựng
      # nào chấp `-mmcu` là chấp thêm, không phải chuẩn — và bản không chấp
      # thì cổng `size` trượt bằng một lỗi CÚ PHÁP CÔNG CỤ, không phải lỗi mã
      # (SL-114).
      - --mcu={mcu}
      - "{binary}"
    timeout_s: 30
    parse:
      success_exit_codes: [0]
      metric_regex:
        flash_bytes: "Program:\\s+(\\d+)\\s+bytes"
        flash_pct: "Program:.*\\(([\\d.]+)% Full\\)"
        sram_bytes: "Data:\\s+(\\d+)\\s+bytes"
        sram_pct: "Data:.*\\(([\\d.]+)% Full\\)"

  static:
    description: Phân tích tĩnh theo bộ quy tắc trong rules/.
    command:
      - cppcheck
      - --enable=warning,style,performance,portability
      - --error-exitcode=1
      - --inline-suppr
      - --platform=avr8
      - --std=c11
      - "{source}"
    timeout_s: 120
    parse:
      success_exit_codes: [0]
      error_regex: "^(?P<file>[^:]+):(?P<line>\\d+):\\d+:\\s+(?:error|warning):\\s+(?P<msg>.+)$"

  flash:
    description: >-
      Nạp firmware xuống board. LUÔN cần người xác nhận — engine từ chối nạp
      pack nào khai báo năng lực này mà thiếu requires_confirmation (FR-DIA-02).
    requires_confirmation: true
    command:
      - avrdude
      - -c
      - "{programmer}"
      - -p
      - "{mcu}"
      - -P
      - "{port}"
      - -b
      - "{baud}"
      - -U
      # `:i` = Intel HEX, ĐÚNG định dạng ảnh mà pack này sinh ra.
      #
      # Trước SL-120 chỗ này là `:e` (ELF). avrdude không đọc được tệp, ghi
      # 0 byte, rồi THOÁT 0 — nên hai phiên làm việc liền tin rằng firmware
      # đã nằm trên chip trong khi bo vẫn chạy mã gốc của bộ kit.
      - "flash:w:{binary}:i"
    timeout_s: 180
    parse:
      success_exit_codes: [0]
      # Bắt cả hai đời câu chữ: avrdude cũ in `avrdude: error: …`, bản 8.2 in
      # `Error: …`. Chỉ khớp đời cũ thì dòng lỗi VÔ HÌNH với lớp phân tích.
      error_regex: "^(?:avrdude:\\s+)?(?:[Ee]rror|ERROR)[:\\s]+(?P<msg>.+)$"
      # Bằng chứng đã thật sự ghi. Mã thoát 0 không nói công cụ đã làm gì.
      require_regex: "\\b[1-9]\\d* bytes of flash (?:written|verified)\\b"

  flash_verify:
    description: >-
      Đọc ngược Flash và so với ảnh vừa gửi. avrdude gọi đây là chế độ 'v'
      (verify): nó đọc lại từng byte trên chip chứ không tin vào mã thoát của
      lần ghi. Không cần xác nhận riêng — chỉ đọc, không đổi gì trên thiết bị,
      và nó luôn chạy ngay sau một lần nạp mà người đã xác nhận.
    command:
      - avrdude
      - -c
      - "{programmer}"
      - -p
      - "{mcu}"
      - -P
      - "{port}"
      - -b
      - "{baud}"
      - -U
      # `:i` = Intel HEX — xem chú thích ở năng lực `flash` phía trên.
      - "flash:v:{binary}:i"
    timeout_s: 180
    parse:
      success_exit_codes: [0]
      error_regex: "^(?:avrdude:\\s+)?(?:[Ee]rror|ERROR|verification error)[:\\s]+(?P<msg>.+)$"
      # Đọc ngược 0 byte KHÔNG phải là "khớp". Đây là chỗ hỏng đắt nhất của
      # SL-120: cổng báo ĐÃ KIỂM trong khi nó không kiểm gì cả.
      require_regex: "\\b[1-9]\\d* bytes of flash verified\\b"

  sim:
    description: >-
      Cầu nối cổng SIL: biên dịch firmware cho máy chủ qua lớp HAL giả lập rồi
      nối vào mô hình vật lý của dự án (FR-SIM-01, ADR-05).
    command:
      - "{python}"
      - -m
      - eaa.tools.sim_runner
      - --model={sim_model}
      - --scenarios={sim_scenarios}
      - --controller={hal_mock}
      - --profile={sim_profile}
      - --scenario={scenario}
      - --params={sim_params}
    timeout_s: 300
    parse:
      success_exit_codes: [0]
      metric_regex:
        max_angle_deg: "max_angle_deg=([\\d.eE+-]+)"
        settling_time_s: "settling_time_s=([\\d.eE+-]+)"
        steady_state_deg: "steady_state_deg=([\\d.eE+-]+)"
